services:
  scraper:
    build: .
    volumes:
      - ./output:/app/output
    command: ["--max-pages", "2"] # Coleta apenas 2 páginas para teste rápido local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d books"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: